<!doctype html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="U-Bahn">
<link rel="apple-touch-icon" href="icon.png">
<title>U-Bahn Abfahrten</title>
<!--
  Eigenständige Version für iPad / Tablet / jeden Browser.
  Holt die Echtzeitdaten direkt von der MVG (kein Server nötig).
  Bewusst ohne moderne JavaScript-/CSS-Features geschrieben, damit sie auch auf alten iPads läuft.
  Einstellungen per Adresse: ?station=Theresienwiese  ?richtung=alle  ?zeilen=5
-->
<style>
  * { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; -webkit-text-size-adjust: 100%; }

  .housing { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #15171c; padding: 1.6vh;
             display: -webkit-box; display: -webkit-flex; display: flex; }
  .panel { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; position: relative; overflow: hidden; border-radius: 0.6vh;
           background: #0a2a8e; background: -webkit-linear-gradient(top, #0b2f9a, #06207a); background: linear-gradient(to bottom, #0b2f9a, #06207a);
           display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; }
  .side { width: 22vh; margin-left: 1.6vh; text-align: center; }

  .flexrow { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .grow { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; }

  header { padding: 1.6vh 2.4vh 1.2vh; border-bottom: 0.3vh solid rgba(255,255,255,.25); }
  .station { font-size: 4.2vh; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dir { font-size: 3vh; color: #a9c0ff; white-space: nowrap; margin-left: 2vh; }

  .cols { font-size: 2.2vh; color: #a9c0ff; padding: 1vh 2.4vh .6vh; text-transform: uppercase; letter-spacing: .1em; }
  .c1 { width: 13.4vh; } .c3 { width: 17vh; text-align: right; }

  #rows { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .row { height: 13vh; padding: 0 2.4vh; font-size: 6.4vh; font-weight: bold; border-bottom: 0.2vh solid rgba(255,255,255,.12); }
  .row.first { font-size: 7.4vh; }
  .badge { display: inline-block; width: 10vh; height: 6.2vh; line-height: 6.2vh; text-align: center; font-size: 4.4vh; font-weight: bold;
           border-radius: 0.6vh; box-shadow: 0 0 0 0.25vh rgba(255,255,255,.85); }
  .dest { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dest small { display: block; font-size: 2.4vh; font-weight: normal; color: #ffd400; }
  .late { color: #ffd400; }
  .now { font-size: .8em; -webkit-animation: blink 1s steps(2, start) infinite; animation: blink 1s steps(2, start) infinite; }
  .cancelled .dest, .cancelled .c3 { text-decoration: line-through; opacity: .6; }
  @-webkit-keyframes blink { to { visibility: hidden; } }
  @keyframes blink { to { visibility: hidden; } }
  .empty { padding: 8vh 4vh; font-size: 4vh; color: #a9c0ff; text-align: center; }

  footer { height: 6vh; background: rgba(0,0,0,.25); border-top: 0.3vh solid rgba(255,255,255,.25); font-size: 2.8vh; overflow: hidden; white-space: nowrap; }
  .tag { background: #ffd400; color: #000; font-weight: bold; padding: 0 1.4vh; height: 6vh; line-height: 6vh; }
  .ticker { overflow: hidden; height: 6vh; line-height: 6vh; }
  .ticker span { display: inline-block; padding-left: 100%; -webkit-animation: scroll 22s linear infinite; animation: scroll 22s linear infinite; }
  @-webkit-keyframes scroll { to { -webkit-transform: translateX(-100%); } }
  @keyframes scroll { to { transform: translateX(-100%); } }

  .notruf { color: #ff8a3d; font-weight: bold; font-size: 2.4vh; line-height: 1.3; }
  .sos { display: inline-block; background: #ff6a00; color: #fff; padding: .2vh 1vh; margin: .6vh 0; border-radius: .3vh; }
  .clock { width: 20vh; height: 20vh; margin-top: 1.6vh; }
  .digital { font-size: 3.6vh; font-weight: bold; margin-top: 1vh; }
  .gleis { font-size: 3vh; font-weight: bold; margin-top: 1.6vh; }
  .gleis b { display: block; font-size: 8vh; line-height: 1; }

  /* Hochformat: Uhrspalte ausblenden, damit die Tafel Platz hat */
  @media (orientation: portrait) { .side { display: none; } .row { font-size: 5vw; } .row.first { font-size: 5.6vw; } }
</style>
</head>
<body>
<div class="housing">
  <div class="panel">
    <header class="flexrow">
      <div class="station grow" id="station">Schwanthalerhöhe</div>
      <div class="dir" id="dir">Richtung Hauptbahnhof</div>
    </header>
    <div class="cols flexrow"><span class="c1">Linie</span><span class="grow">Ziel</span><span class="c3">Min</span></div>
    <div id="rows"><div class="empty">Lade Abfahrten …</div></div>
    <footer class="flexrow"><div class="tag" id="tag">MVG</div><div class="ticker grow"><span id="ticker">Echtzeitdaten werden geladen …</span></div></footer>
  </div>
  <div class="side">
    <div class="notruf">Notruf<br><span class="sos">SOS</span><br>Nothalt</div>
    <svg class="clock" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="96" fill="#fff" stroke="#222" stroke-width="6"/>
      <g id="ticks"></g>
      <line id="hh" x1="100" y1="112" x2="100" y2="52" stroke="#000" stroke-width="10"/>
      <line id="mh" x1="100" y1="116" x2="100" y2="22" stroke="#000" stroke-width="7"/>
      <g id="sh"><line x1="100" y1="130" x2="100" y2="40" stroke="#c00" stroke-width="2.5"/><circle cx="100" cy="40" r="9" fill="#c00"/></g>
      <circle cx="100" cy="100" r="3" fill="#c00"/>
    </svg>
    <div class="digital" id="digital">--:--:--</div>
    <div class="gleis">Gleis<b id="gleis">–</b></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var MVG = "https://www.mvg.de/api/bgw-pt/v3";

  function param(name, def) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : def;
  }
  var CONFIG = {
    station: param("station", "Schwanthalerhöhe"),
    richtung: param("richtung", "hbf").toLowerCase(),
    gegenrichtung: ["Westendstraße", "Laimer Platz", "Friedenheimer Straße", "Pasing", "Heimeranplatz"],
    rows: parseInt(param("zeilen", "6"), 10) || 6,
    refreshMs: 20000
  };
  // bekannte Haltestelle direkt, andere werden über die MVG-Suche aufgelöst
  var KNOWN = { "Schwanthalerhöhe": "de:09162:250" };
  var LINE_COLORS = { U1: "#52822f", U2: "#c20831", U3: "#ec6726", U4: "#00a984", U5: "#bc7a00", U6: "#0065ae", U7: "#52822f", U8: "#c20831" };

  var globalId = KNOWN[CONFIG.station] || null;
  var departures = [], lastOk = 0, notes = [];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hms(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { ok(JSON.parse(x.responseText)); } catch (e) { fail("Antwort unlesbar"); }
      } else { fail("HTTP " + x.status); }
    };
    x.ontimeout = function () { fail("Zeitüberschreitung"); };
    x.send();
  }

  /* ---- Bahnhofsuhr ---- */
  var ticks = $("ticks"), NS = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 60; i++) {
    var big = i % 5 === 0, l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 100); l.setAttribute("x2", 100); l.setAttribute("y1", 10); l.setAttribute("y2", big ? 34 : 18);
    l.setAttribute("stroke", "#000"); l.setAttribute("stroke-width", big ? 7 : 2.5);
    l.setAttribute("transform", "rotate(" + (i * 6) + " 100 100)");
    ticks.appendChild(l);
  }
  function drawClock() {
    var d = new Date();
    var sec = Math.min((d.getSeconds() + d.getMilliseconds() / 1000) * (60 / 58.5), 60);
    var m = d.getMinutes(), h = d.getHours() % 12;
    $("sh").setAttribute("transform", "rotate(" + (sec * 6) + " 100 100)");
    $("mh").setAttribute("transform", "rotate(" + (m * 6) + " 100 100)");
    $("hh").setAttribute("transform", "rotate(" + (h * 30 + m * 0.5) + " 100 100)");
    $("digital").textContent = hms(d);
  }
  setInterval(drawClock, 200); drawClock();

  /* ---- Daten ---- */
  function setTicker(tag, text) {
    $("tag").textContent = tag;
    if ($("ticker").textContent !== text) $("ticker").textContent = text;
  }
  function showError(msg) {
    var stale = lastOk ? " (Daten von " + hms(new Date(lastOk)) + ")" : "";
    setTicker("STÖRUNG", "Keine Verbindung zur MVG" + stale + ": " + msg + ". Bitte WLAN prüfen.");
    render();
  }

  function load() {
    if (!globalId) {
      getJSON(MVG + "/locations?locationTypes=STATION&query=" + encodeURIComponent(CONFIG.station), function (list) {
        for (var i = 0; i < list.length; i++) if (list[i].globalId) { globalId = list[i].globalId; $("station").textContent = list[i].name; break; }
        if (globalId) load(); else showError("Haltestelle nicht gefunden");
      }, showError);
      return;
    }
    getJSON(MVG + "/departures?limit=40&transportTypes=UBAHN&globalId=" + encodeURIComponent(globalId), function (list) {
      departures = []; notes = [];
      for (var i = 0; i < list.length; i++) {
        var d = list[i];
        departures.push({
          line: d.label, dest: d.destination,
          time: d.realtimeDepartureTime || d.plannedDepartureTime,
          delay: d.delayInMinutes || 0, cancelled: !!d.cancelled,
          platform: d.platform != null ? String(d.platform) : ""
        });
        var msgs = (d.messages || []).concat(d.infos || []);
        for (var k = 0; k < msgs.length; k++) {
          var t = typeof msgs[k] === "string" ? msgs[k] : (msgs[k].message || msgs[k].text || msgs[k].title || "");
          t = t.replace(/<[^>]*>/g, "").replace(/^\s+|\s+$/g, "");
          if (t && notes.indexOf(t) < 0) notes.push(t);
        }
      }
      lastOk = Date.now();
      if (notes.length) setTicker("INFO", notes.join("  ·  "));
      else setTicker("MVG", "Echtzeitdaten der MVG · zuletzt aktualisiert " + hms(new Date()) + " · Bitte zurückbleiben!");
      render();
    }, showError);
  }

  function render() {
    var now = Date.now(), list = [], i;
    for (i = 0; i < departures.length; i++) {
      var d = departures[i];
      if (d.time - now <= -30000) continue;
      if (CONFIG.richtung !== "alle") {
        var opp = false;
        for (var g = 0; g < CONFIG.gegenrichtung.length; g++) if (d.dest && d.dest.indexOf(CONFIG.gegenrichtung[g]) === 0) opp = true;
        if (opp) continue;
      }
      list.push(d);
    }
    $("dir").textContent = CONFIG.richtung === "alle" ? "Alle Richtungen" : "Richtung Hauptbahnhof";
    list.sort(function (a, b) { return a.time - b.time; });
    list = list.slice(0, CONFIG.rows);

    for (i = 0; i < list.length; i++) if (list[i].platform) { $("gleis").textContent = list[i].platform; break; }

    if (!list.length) { $("rows").innerHTML = '<div class="empty">' + (lastOk ? "Zurzeit keine Abfahrten" : "Lade Abfahrten …") + "</div>"; return; }
    var html = "";
    for (i = 0; i < list.length; i++) {
      var e = list[i], mins = Math.max(0, Math.floor((e.time - now) / 60000));
      var minTxt = e.cancelled ? "" : (mins === 0 ? "jetzt" : mins);
      var note = e.cancelled ? "<small>Fahrt fällt aus</small>" : (e.delay > 0 ? "<small>+" + e.delay + " Min Verspätung</small>" : "");
      html += '<div class="row flexrow' + (i === 0 ? " first" : "") + (e.cancelled ? " cancelled" : "") + '">' +
        '<span class="c1"><span class="badge" style="background:' + (LINE_COLORS[e.line] || "#444") + '">' + esc(e.line) + "</span></span>" +
        '<span class="dest grow">' + esc(e.dest) + note + "</span>" +
        '<span class="c3' + (mins === 0 ? " now" : "") + (e.delay > 0 ? " late" : "") + '">' + minTxt + "</span></div>";
    }
    $("rows").innerHTML = html;
  }

  load();
  setInterval(load, CONFIG.refreshMs);
  setInterval(render, 5000);
})();
</script>
</body>
</html>
